apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    # 1. Global Settings
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    # 2. Alerting
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                # NOTE: In Staging, this DNS name might need to be 'alertmanager-staging:9093'
                - alertmanager:9093

    # 3. Rule Files
    rule_files:
      - "/etc/prometheus/rules/*.yml"

    # 4. Scrape Configs
    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      # Job 2: Multi-Tenant Client Monitoring
      - job_name: "CLIENT_MONITORING"
        relabel_configs:
          - source_labels: [alias]
            target_label: instance
            replacement: $1
        
        static_configs:
          # --- TENANT: CRUZCON ---
          - targets: ["100.112.106.118:9182"]
            labels:
              company: "Cruzcon"
              alias: "Cruzcon-APP"
              role: "Application"
              connection: "magicdns"

          - targets: ["100.102.111.12:9182"]
            labels:
              company: "Cruzcon"
              alias: "Cruzcon-RD"
              role: "Remote_Desktop"
              connection: "magicdns"

          # --- TENANT: XTI-Laptop ---
          - targets: ["100.76.232.24:9182"]
            labels:
              company: "XTI"
              alias: "XTI-Cruzcon-Staging-Test"
              role: "Application"
              connection: "magicdns"

          # --- TENANT: NEW COMPANY ---
          - targets: ["100.123.45.67:9182"]
            labels:
              company: "NewCompany"
              alias: "NewCo-Server"
              role: "Database"
              connection: "magicdns"