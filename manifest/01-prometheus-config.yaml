apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "CLIENT_MONITORING"
        relabel_configs:
          - source_labels: [alias]
            target_label: instance
            replacement: $1
        
        static_configs:
          - targets: ["100.112.106.118:9182"] 
            labels:
              company: "Cruzcon"
              alias: "Cruzcon-APP"
              role: "Application"
              connection: "magicdns"

          - targets: ["100.102.111.12:9182"] 
            labels:
              company: "Cruzcon"
              alias: "Cruzcon-RD"
              role: "Remote_Desktop"
              connection: "magicdns"

          - targets: ["100.76.232.24:9182"] 
            labels:
              company: "XTI"
              alias: "XTI-Laptop"
              role: "Application"
              connection: "magicdns"