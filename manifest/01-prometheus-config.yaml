apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    # 1. Global Settings
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    # 2. Alerting (MOVED LEFT - Now a sibling of global)
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              # NOTE: In Staging, this DNS name might need to be 'alertmanager-staging:9093'
              # unless you have a Service named 'alertmanager' in that namespace.
              - alertmanager:9093

    # 3. Rule Files (Sibling of global)
    rule_files:
      - "/etc/prometheus/rules/*.yml"

    # 4. Scrape Configs (Sibling of global)
    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      # Job 2: Multi-Tenant Client Monitoring
      - job_name: "CLIENT_MONITORING"
        relabel_configs:
          - source_labels: [alias]
            target_label: instance
            replacement: $1
        
        static_configs:
          # --- TENANT: CRUZCON ---
          - targets: ["100.112.106.118:9182"] 
            labels:
              company: "Cruzcon"
              alias: "Cruzcon-APPPPP"
              role: "Application"
              connection: "magicdns"

          - targets: ["100.102.111.12:9182"] 
            labels:
              company: "Cruzcon"
              alias: "Cruzcon-RD"
              role: "Remote_Desktop"
              connection: "magicdns"

          # --- TENANT: XTI-Laptop ---
          - targets: ["100.76.232.24:9182"] 
            labels:
              company: "XTI"
              alias: "XTI-Laptop"
              role: "Application"
              connection: "magicdns"

          # --- TENANT: NEW COMPANY ---
          - targets: ["100.123.45.67:9182"] 
            labels:
              company: "NewCompany"
              alias: "NewCo-Server"
              role: "Database"
              connection: "magicdns"