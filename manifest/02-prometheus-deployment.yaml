apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        # --- 1. Main Prometheus Container ---
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--web.enable-lifecycle" # <--- Crucial: Allows the reload signal
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus # <--- subPath removed!
            - name: alert-rules
              mountPath: /etc/prometheus/rules

        # --- 2. Sidecar Config Reloader ---
        - name: config-reloader
          image: jimmidyson/configmap-reload:v0.5.0
          args:
            - "--volume-dir=/etc/prometheus"
            - "--volume-dir=/etc/prometheus/rules"
            - "--webhook-url=http://localhost:9090/-/reload"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: alert-rules
              mountPath: /etc/prometheus/rules

      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: alert-rules
          configMap:
            name: prometheus-alert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9090