apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Limboocy/k8s-observability.git'  # <--- YOUR REPO URL
    targetRevision: staging  # <--- CRITICAL: Watches the staging branch
    path: manifest           # <--- Same folder as production
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring-staging  # <--- CRITICAL: Deploys to the testing room
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true